# coredns-custom.yaml — resolves `host.k3d.internal` to this cluster's own docker
# bridge gateway (Plan 03, Task 1; Phase 2 deferred-items.md item 3). The platform
# cluster needs this for the same reason the app cluster does — any tooling on this
# cluster (e.g. a future LocalStack smoke check) that talks to the host over
# `host.k3d.internal` needs it to resolve here too, and D-02's reachability proof
# (RESEARCH.md) asserts both clusters, not just the app cluster.
#
# k3d's shipped CoreDNS Corefile already imports both
# `/etc/coredns/custom/*.override` (directives merged INTO the existing default
# `.:53` server block) and `/etc/coredns/custom/*.server` (a brand-new, independently
# imported server block, scoped to whatever zone it declares) — these are two
# distinct, documented k3s/rke2 CoreDNS extension points, not one.
#
# DEVIATION from RESEARCH.md's originally-researched shape (Rule 1 - bug, found live
# at execution, identical root cause on this cluster as on the app cluster — see
# clusters/app/coredns-custom.yaml's header for the full CrashLoopBackOff evidence):
# a bare `hosts.override` key containing a second `hosts { ... }` block collides
# with the default `.:53` block's own existing `hosts /etc/coredns/NodeHosts { ... }`
# — CoreDNS refuses a second `hosts` plugin instance in the same server block. The
# `.server` key opens an independent server block scoped to exactly
# `host.k3d.internal:53`, free to run its own `hosts` plugin without the collision.
#
# __GATEWAY_IP__ is a placeholder substituted at apply time by
# scripts/apply-coredns-custom.sh — docker assigns this cluster's own bridge gateway
# IP at network-creation time, so it is NEVER a fixed literal here. Re-derive by hand
# with:
#   docker network inspect k3d-platform --format '{{range .IPAM.Config}}{{.Gateway}}{{end}}'
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  hostk3dinternal.server: |
    host.k3d.internal:53 {
      hosts {
        __GATEWAY_IP__ host.k3d.internal
        fallthrough
      }
    }
