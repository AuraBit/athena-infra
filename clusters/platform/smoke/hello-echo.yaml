# hello-echo.yaml — proves the platform cluster's Gateway/TLS chain
# end-to-end (Plan 02, Task 1), mirroring clusters/app/smoke/hello-echo.yaml
# with hostnames swapped to the platform domain. Namespace `athena-smoke`;
# Service on port 80 forwards to the echo container's port 3000; HTTPRoute
# binds it to the `athena-platform` Gateway for exactly one hostname:
# hello.platform.athena.net.
#
# Image: registry.k8s.io/gateway-api/echo-basic:v1.5.1 — same pinned image
# as the app cluster's smoke workload (Gateway API project's own official
# example backend).
apiVersion: v1
kind: Namespace
metadata:
  name: athena-smoke
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hello-echo
  namespace: athena-smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-echo
  namespace: athena-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-echo
  template:
    metadata:
      labels:
        app: hello-echo
    spec:
      serviceAccountName: hello-echo
      containers:
        - name: hello-echo
          image: registry.k8s.io/gateway-api/echo-basic:v1.5.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
---
apiVersion: v1
kind: Service
metadata:
  name: hello-echo
  namespace: athena-smoke
spec:
  type: ClusterIP
  selector:
    app: hello-echo
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-echo
  namespace: athena-smoke
spec:
  parentRefs:
    - name: athena-platform
      namespace: gateway
  hostnames:
    - "hello.platform.athena.net"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: hello-echo
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
