# hello-echo.yaml — the one path proving the whole skeleton end-to-end
# (Plan 01, Task 2). Namespace `athena-smoke`; Service on port 80 forwards
# to the echo container's port 3000; HTTPRoute binds it to the `athena`
# Gateway for exactly one hostname: hello.athena.net.
#
# Image: registry.k8s.io/gateway-api/echo-basic:v1.5.1 — the Gateway API
# project's own official example backend (pinned tag, confirmed directly
# against envoyproxy/gateway's own v1.8.3 quickstart manifest, which uses
# the identical image for the identical purpose).
apiVersion: v1
kind: Namespace
metadata:
  name: athena-smoke
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hello-echo
  namespace: athena-smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-echo
  namespace: athena-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-echo
  template:
    metadata:
      labels:
        app: hello-echo
    spec:
      serviceAccountName: hello-echo
      containers:
        - name: hello-echo
          image: registry.k8s.io/gateway-api/echo-basic:v1.5.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
---
apiVersion: v1
kind: Service
metadata:
  name: hello-echo
  namespace: athena-smoke
spec:
  type: ClusterIP
  selector:
    app: hello-echo
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-echo
  namespace: athena-smoke
spec:
  parentRefs:
    - name: athena
      namespace: gateway
  hostnames:
    - "hello.athena.net"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: hello-echo
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
