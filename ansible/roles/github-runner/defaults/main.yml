---
# defaults/main.yml — github-runner role knobs (Plan 06, Task 1; CONTEXT.md
# D-16/D-17). Every value that could plausibly change across a re-run or a
# future estate expansion is a variable here, not a literal buried in
# tasks/main.yml or the templates — this role is "the substance" of
# Ansible's one scoped role in this estate (D-16), kept production-shaped.

# ---------------------------------------------------------------------------
# GitHub Actions runner binary — pinned explicitly (RESEARCH.md T-01-04:
# never track "latest"). The actions/runner GitHub Releases page publishes
# no separate .sha256 asset for this tarball; the authoritative per-release
# checksum source is GET /orgs/{org}/actions/runners/downloads (requires a
# manage_runners-scoped token), fetched live at plan-execution time and
# independently re-verified with sha256sum against the downloaded artifact
# before this role was written.
# ---------------------------------------------------------------------------
athena_runner_version: "2.336.0"
athena_runner_download_url: "https://github.com/actions/runner/releases/download/v{{ athena_runner_version }}/actions-runner-linux-x64-{{ athena_runner_version }}.tar.gz"
athena_runner_checksum_sha256: "04cf0be1aff4c3ec3554466c39124ca250e3effd8873bb7e8d68535aa9505d5d"

# ---------------------------------------------------------------------------
# Organisation-level registration
# ---------------------------------------------------------------------------
athena_runner_org: "AuraBit"

# Retired: athena_runner_name (fixed "athena-runner-01"). Plan 02-02 Task 3
# pools the runner into N templated systemd instances (athena-runner@1,
# athena-runner@2, ...), each registering under a distinct name derived from
# this prefix + the systemd instance name (%i) — see
# templates/jitconfig.sh.j2.
athena_runner_name_prefix: "athena-runner"

# D-11 puts every job that needs localhost:4566 (plan, apply, terraform
# test, the awslocal verify) on self-hosted, and D-01's flow means a PR plan
# and a main apply can be in flight at the same moment. One runner unit
# makes those serialise on runner capacity alone, which is indistinguishable
# in the Actions UI from the state-lock queuing IAC-03's drill is meant to
# demonstrate. Two units separate the two phenomena cleanly; the knob exists
# so it can be raised if a later phase needs more headroom.
athena_runner_pool_size: 2

# The estate-specific label alongside the three standard ones. Phases 2, 3,
# and 7 target this exact list in their `runs-on:` — see
# heavy-selfhosted.yml (Task 2) and docs/runbooks/runner-ops.md (Task 3).
athena_runner_labels:
  - self-hosted
  - linux
  - x64
  - athena-local

# Runner group scoped to selected repositories only (D-08: "self-hosted
# runner scoped to selected repos"). GitHub's Default group (id 1) ships
# with allows_public_repositories=false and visibility=all — every repo in
# this estate is public, so the Default group would either silently refuse
# jobs from all of them (allows_public_repositories=false, as verified live
# against this org before this role was written) or, if opened up, expose
# the runner to every repo in the org rather than just the one that
# actually uses it. A dedicated "athena-selfhosted" runner group (id 3) was
# created for this plan via a live API call (the Terraform GitHub provider
# does not manage runner groups — see docs/runbooks/github-bootstrap.md's
# provider-coverage-gaps section), scoped via visibility=selected to the
# repos whose workflows target self-hosted: athena-infra (Phase 2), plus
# athena-app and athena-gitops (added 2026-08-05 for Phase 3's media-ci
# build/publish/handoff and promote.yml resolve jobs — their absence
# presents as jobs stuck `queued` while runners show online/idle), with
# allows_public_repositories explicitly enabled since every estate repo is
# public. See docs/runbooks/runner-ops.md's Blast radius section for the
# full reasoning.
athena_runner_group_id: 3
athena_runner_group_name: "athena-selfhosted"

# ---------------------------------------------------------------------------
# Local OS user & filesystem layout
# ---------------------------------------------------------------------------
athena_runner_user: "athena-runner"
athena_runner_home: "/home/athena-runner"
athena_runner_work_folder: "_work"

# ---------------------------------------------------------------------------
# Registration credential — root-readable, outside every estate repository
# (user_setup). This role only ASSERTS this file's presence/shape and
# tightens its group ownership so the runner user can read it at runtime;
# it never reads the PAT's contents into an Ansible variable (no_log
# throughout tasks/main.yml's assertions).
# ---------------------------------------------------------------------------
athena_runner_pat_file: "/etc/athena-runner/github-runner-pat"

# ---------------------------------------------------------------------------
# CI toolchain — D-14: this host is a golden agent image. Every tool a CI
# job invokes on the self-hosted runner is Ansible-installed at a pinned
# version, the pins living here beside the runner-binary pin above.
# GitHub-hosted jobs use `setup-*` actions instead of this block (that split
# is Plan 02-04's territory, not this role's).
# ---------------------------------------------------------------------------

# Terraform — this literal MUST equal TF_VERSION in
# .github/workflows/lint.yml (Plan 02-02 acceptance criteria assert this by
# extracting both and comparing). A drift between these two values is itself
# the defect: a hosted static job (fmt/validate) and a self-hosted job
# (plan/apply/awslocal verify/terraform test, per D-11) must agree on the
# exact Terraform version or fmt/validate disagreements become
# unreproducible between the two job types.
athena_terraform_version: "1.15.8"
athena_terraform_download_url: "https://releases.hashicorp.com/terraform/{{ athena_terraform_version }}/terraform_{{ athena_terraform_version }}_linux_amd64.zip"
athena_terraform_checksum_sha256: "d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d"

# checkov and awscli-local — pip packages, pinned per the package-legitimacy
# checkpoint (Plan 02-02 Task 1; T-02-SC), each version confirmed live
# against its PyPI project page (bridgecrewio/checkov,
# localstack/awscli-local) before being pinned here. Unlike the Terraform
# zip and the runner tarball above, PyPI ships no per-artifact checksum for
# either package, so these two get the version-marker-file idempotency
# treatment (a rendered "tool=version" fingerprint compared against a marker
# file, see tasks/main.yml) instead of a `checksum:` argument — a
# deliberate, called-out difference in verification strength, not an
# oversight.
athena_checkov_version: "3.3.9"
athena_awscli_local_version: "0.22.2"

# Dedicated virtualenv, owned by the runner user, isolated from the host's
# system Python — a system-wide `pip install` on this Arch host fights the
# distro package manager (PEP 668 externally-managed-environment); a venv
# sidesteps that entirely. checkov and awslocal are symlinked from here onto
# /usr/local/bin (already on the runner user's PATH via /etc/profile, and on
# the systemd unit's default PATH) so CI job steps invoke them by bare name.
athena_runner_tool_venv: "{{ athena_runner_home }}/.tooling"
