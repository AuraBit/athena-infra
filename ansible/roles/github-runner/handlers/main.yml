---
# Handlers for the github-runner role (Plan 06, Task 1). Mirrors
# bootstrap-dns/bootstrap-localstack's handler shape: notified only when the
# rendered systemd unit or the JIT script's content actually changes
# (e.g. a future pinned-version bump, a label-list change, or an edit to
# jitconfig.sh.j2 itself) — a restart here interrupts at most the runner's
# current idle-listening state, never a job in progress, since GitHub's own
# ephemeral lifecycle already tears the unit down between jobs.
- name: Restart athena-runner unit
  become: true
  ansible.builtin.systemd_service:
    name: athena-runner
    daemon_reload: true
    state: restarted
